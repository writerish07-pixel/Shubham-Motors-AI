# Fly.io — Singapore until Mumbai has capacity (bom is paid-plan + often full).
# Always-on: Exotel Voicebot WebSockets cannot survive scale-to-zero.
# Deploy: fly launch --copy-config  (first time) then fly deploy
# Secrets: see .env.example / docs/WHAT_I_NEED.md
# Move to bom later: fly scale count 1 --region bom && set primary_region = "bom"

app = "shubham-motors-ai"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  BASE_PATH = "/"
  STATIC_DIR = "/app/public"
  COST_MODE = "balanced"
  COST_ALERT_INR_PER_MIN = "4"
  APP_VERSION = "fly"
  # BotSpace Channel settings → ID (Shubham Motors WhatsApp +91 7240516000)
  BOTSPACE_PHONE_NUMBER_ID = "69ba3b443c58de2b169911a3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 40
    soft_limit = 25

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
