# fly.toml app configuration file generated for shubham-motors-ai on 2026-08-15T20:19:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shubham-motors-ai'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_VERSION = 'fly'
  BASE_PATH = '/'
  COST_MODE = 'strict'
  NODE_ENV = 'production'
  PORT = '8080'
  STATIC_DIR = '/app/public'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 40
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/healthz'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'
