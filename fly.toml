# Fly.io — Singapore until Mumbai has capacity (bom is paid-plan + often full).
# Always-on: Exotel Voicebot WebSockets cannot survive scale-to-zero.
# Deploy: fly launch --copy-config  (first time) then fly deploy
# Secrets: see .env.example / docs/WHAT_I_NEED.md
# Move to bom later: fly scale count 1 --region bom && set primary_region = "bom"

app = "shubham-motors-ai"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  BASE_PATH = "/"
  STATIC_DIR = "/app/public"
  COST_MODE = "strict"
  APP_VERSION = "fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 40
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/api/healthz"
  timeout = "5s"
