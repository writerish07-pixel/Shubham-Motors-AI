# Alternative to Fly.io: one VPS in Mumbai/Bangalore (Lightsail, DO, Vultr).
# Put a TLS proxy (Caddy/nginx) in front, set PUBLIC_BASE_URL to https://your.domain
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      NODE_ENV: production
      BASE_PATH: "/"
      STATIC_DIR: /app/public
      COST_MODE: balanced
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
