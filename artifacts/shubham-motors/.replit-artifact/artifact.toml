kind = "web"
previewPath = "/"
title = "Shubham Motors AI Voice Agent"
version = "1.0.0"
id = "artifacts/shubham-motors"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22658

[services.development]
run = "pnpm --filter @workspace/shubham-motors run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shubham-motors", "run", "build" ]
publicDir = "artifacts/shubham-motors/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22658"
BASE_PATH = "/"
