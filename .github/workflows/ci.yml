name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm exec tsc -b lib/db lib/api-zod lib/api-client-react

      - name: Typecheck api-server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck web frontend
        run: pnpm --filter shubham-motors run typecheck

      - name: Unit tests
        run: pnpm --filter @workspace/api-server run test

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build
